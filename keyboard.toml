# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "MacroNumpad"
product_name = "MacroNumpad"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Hoser"
chip = "esp32c6"
serial_number = "numpad-v1"

[matrix]
# Row and col pins are mandatory
row_pins = ["GPIO14", "GPIO15", "GPIO18", "GPIO19", "GPIO20", "GPIO21"]
col_pins = ["GPIO0", "GPIO1", "GPIO2", "GPIO3", "GPIO4", "GPIO5"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 6
cols = 6
map = """
(0,0) (0,1) (0,2) (0,3)
[y=0.25]
(1,0) (1,1) (1,2) (1,3) [0.5] (1,4) (1,5)
(2,0) (2,1) (2,2) (2,3,@2u_tall) [0.5] (2,4) (2,5)
(3,0) (3,1) (3,2) [0.5] (3,4) (3,5)
(4,0) (4,1) (4,2) (4,3,@2u_tall) [0.5] (4,4) (4,5)
(5,0,@2u) (5,2) [0.5] (5,4) (5,5)
"""

[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 3

[[keymap.layer]] # layer 0
keys = """
_ _ _ _
NumLock KpSlash KpAsterisk KpMinus  _ _
Kp7 Kp8 Kp9   KpPlus  _ _
Kp4 Kp5 Kp6           _ _
Kp1 Kp2 Kp3   KpEnter _ _
Kp0     KpDot         _ _
"""

